id: 1739310b-46c4-529a-b9f5-336a6c3875fc
name: New inbox rule that forwards or redirects mail
description: A mailbox rule was created or changed to forward, forward as attachment, or redirect email. Attackers who take
  over a mailbox use these rules to watch finance conversations and hide replies.
severity: Medium
requiredDataConnectors:
- connectorId: Office365
  dataTypes:
  - OfficeActivity (Exchange)
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
- Collection
- DefenseEvasion
relevantTechniques:
- T1114
- T1564
query: |
  // New or changed inbox rule that forwards or redirects mail  (T1114.003, T1564.008)
  OfficeActivity
  | where TimeGenerated > ago(1h)
  | where OfficeWorkload == "Exchange"
  | where Operation in ("New-InboxRule", "Set-InboxRule", "UpdateInboxRules")
  | where Parameters has_any ("ForwardTo", "ForwardAsAttachmentTo", "RedirectTo")
  | extend ClientIPAddress = case(
      ClientIP startswith "[", extract(@"^\[([^\]]+)\]", 1, ClientIP),   // [IPv6]:port
      countof(ClientIP, ":") == 1, tostring(split(ClientIP, ":")[0]),     // IPv4:port
      ClientIP)                                                           // bare address
  | project TimeGenerated, UserId, ClientIPAddress, Operation, Parameters
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: FullName
    columnName: UserId
- entityType: IP
  fieldMappings:
  - identifier: Address
    columnName: ClientIPAddress
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT5H
    matchingMethod: AllEntities
version: 1.0.0
kind: Scheduled
